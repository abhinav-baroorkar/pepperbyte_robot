cobra_driver_node:
  ros__parameters:
    serial_port: "/dev/cobra_flex"
    baud_rate: 115200
    wheel_diameter: 0.0745
    track_width: 0.2285
    odom_frame: "odom"
    base_frame: "base_link"
    # publish_tf is false by default because robot_localization EKF publishes
    # the odom->base_link transform in mapping modes. Set to true only when
    # running without the EKF (e.g. teleop_only mode).
    publish_tf: false
    cmd_vel_timeout_ms: 300
