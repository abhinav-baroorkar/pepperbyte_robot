<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppermint Robotics</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pb-bg':    '#1a1a2e',
            'pb-panel': '#16213e',
            'pb-accent':'#00d4ff',
            'pb-green': '#00ff88',
            'pb-red':   '#ff4444',
          }
        }
      }
    }
  </script>

  <!-- React 18 (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- htm — JSX-like tagged templates, no build step -->
  <script src="https://unpkg.com/htm@3/dist/htm.js"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-pb-bg text-white font-sans h-screen overflow-hidden select-none">
  <div id="root" class="h-full"></div>

  <!-- Bootstrap htm -->
  <script>window.html = htm.bind(React.createElement);</script>

  <!-- Components (order matters — deps first) -->
  <script src="/static/js/MapCanvas.js"></script>
  <script src="/static/js/StatusBar.js"></script>
  <script src="/static/js/Controls.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
